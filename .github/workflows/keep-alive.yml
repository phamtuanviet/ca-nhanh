name: keep-alive

# Gọi health check (có truy vấn CSDL) để dự án Supabase gói Free không bị tạm dừng sau 7 ngày không hoạt động.
# Đặt secret APP_URL (ví dụ https://ca-nhanh.vercel.app) trong Settings → Secrets and variables → Actions.
on:
  schedule:
    - cron: '0 1 * * 1,4' # 08:00 thứ Hai và thứ Năm, giờ Việt Nam
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi /api/v1/health
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Chưa đặt secret APP_URL, bỏ qua."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 "$APP_URL/api/v1/health"
